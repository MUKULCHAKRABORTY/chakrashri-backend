# =============================================================================
# ⚠️  THIS FILE IS NOT CURRENTLY IN EFFECT. READ BEFORE TRUSTING ANYTHING IN IT.
# =============================================================================
#
# This is the TARGET configuration for when the project moves to Render's paid
# Starter plan. It is kept here, complete and ready, deliberately — do not
# delete it to "clean up". Today it describes infrastructure that does not
# exist.
#
# HOW WE KNOW IT IS INERT (checked 2026-08-29, not assumed):
#   • The live service runs in region OREGON. This file says `region: ohio`.
#     A Blueprint-managed service cannot disagree with its own blueprint.
#   • The Render dashboard lists ONE service, under "Ungrouped Services" rather
#     than a Blueprint project. The three cron services below do not exist.
#   • A deploy went from "==> Deploying..." straight to "==> Running 'npm start'"
#     with no migrate step, and production was still missing migration 015
#     afterwards — so `preDeployCommand` never ran.
#
# The service was created by hand in the Render dashboard. A render.yaml only
# governs services created FROM it as a Blueprint; for a hand-made service it is
# an inert text file, however correct its contents are.
#
# WHAT THE FREE PLAN CANNOT DO, so you know what you are actually buying:
#   • No cron services      → the three jobs below simply do not run.
#   • No pre-deploy command → migrations are NOT applied on deploy.
#   • Spins down after ~15 min idle → a Razorpay webhook can hit a sleeping
#     instance and time out. See scripts/keep-alive.js.
#
# UNTIL YOU UPGRADE, these are yours to do — nothing here does them for you:
#   1. Run `npm run migrate` by hand after any deploy that adds a migration.
#      Check with `npm run test:db`, which says outright when the database is
#      behind.
#   2. Arrange the three scheduled jobs some other way. Skipping them is not
#      cosmetic — see each service's own comment below for what breaks. The
#      payment reconciler in particular is the safety net for "customer paid,
#      webhook was throttled", which is MORE likely on free-tier cold starts,
#      not less.
#
# WHEN YOU DO UPGRADE:
#   Render dashboard → Blueprints → New Blueprint Instance → point it at this
#   repo. Then delete the hand-made service, or Render will run two of them.
#   Re-enter every `sync: false` secret, and confirm the region change is what
#   you want (moving to ohio matches the Neon database and cuts per-query
#   latency; it also means a new service URL unless you migrate it deliberately).
# =============================================================================

services:
  # =========================================================================
  # API
  # =========================================================================
  - type: web
    name: chakrashri-api
    runtime: node
    region: ohio # matches your Neon database (us-east-2) — avoids unnecessary cross-country latency on every DB round-trip
    plan: starter # cheapest paid tier — avoids free-tier cold starts, which delay Razorpay webhook delivery
    buildCommand: npm ci --omit=dev
    # Migrations run on every deploy, before the new process starts serving.
    # `npm ci` (not `install`) installs exactly what package-lock.json pins, so a
    # transitive dependency cannot change silently between a tested build and a
    # production one.
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health # liveness only — deliberately does NOT touch the DB, so a database blip cannot make Render restart-loop the API. Point uptime monitoring at /api/ready instead, which does check it.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TZ
        value: Asia/Kolkata # BIZ-06 — the business runs in IST; UTC bucketed evening sales into the next day and rejected valid same-day bookings before 05:30
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard — never commit real secrets to this file
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_JWT_EXPIRES_IN
        value: 8h
      - key: REQUIRE_TOKEN_VERSION
        # AUTH-03 rollout. Tokens issued before that change carry no `tv` claim.
        # Leave false for the first 7 days (one JWT_EXPIRES_IN window) so the
        # deploy does not sign every customer out mid-session, then flip to
        # "true" to close the grace period permanently.
        value: "false"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false # the deployed storefront's real origin, no trailing slash
      - key: ADDITIONAL_CLIENT_ORIGINS
        sync: false # optional, comma-separated — Netlify branch previews
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "600"
      - key: LOG_LEVEL
        value: info
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: JOBS_TRIGGER_TOKEN
        # FREE-PLAN ONLY. Lets an external scheduler start the three jobs below
        # over HTTP, because the free tier has no cron services. Once these cron
        # services actually exist (i.e. once this blueprint is in effect on a
        # paid plan) it is redundant — remove it then, so there is not a second,
        # unnecessary way to trigger background work on production.
        # Empty or under 32 characters = the endpoint stays disabled.
        sync: false

  # =========================================================================
  # Abandoned-checkout sweep — releases reserved stock and booking capacity
  # =========================================================================
  - type: cron
    name: chakrashri-expiry-sweep
    runtime: node
    region: ohio
    plan: starter
    schedule: "*/10 * * * *" # every 10 minutes
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/release-expired-orders.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: ORDER_RESERVATION_EXPIRY_MINUTES
        value: "30" # overridden by the site_settings value of the same name if present
      - key: LOG_LEVEL
        value: info

  # =========================================================================
  # OPS-02 — Payment reconciliation.
  #
  # This is the fix for the gap the audit found: scripts/reconcile-payments.js
  # existed and documented its own schedule, but nothing ever ran it. It is the
  # third and most authoritative of the three paths that can confirm a payment —
  # the one that asks Razorpay directly — and without it, "customer paid, closed
  # the tab, webhook was throttled" ends with the order cancelled and the money
  # captured.
  #
  # It also resolves refunds left in-flight by a crash (PAY-02) and exits
  # non-zero on any amount mismatch, so a real problem shows as a failed cron run
  # rather than a green tick with a warning buried in the log.
  # =========================================================================
  - type: cron
    name: chakrashri-payment-reconcile
    runtime: node
    region: ohio
    plan: starter
    schedule: "*/15 * * * *" # every 15 minutes
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/reconcile-payments.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RECONCILE_LOOKBACK_HOURS
        value: "72"
      - key: LOG_LEVEL
        value: info

  # =========================================================================
  # Scheduled email dispatch
  #
  # Restock alerts, booking reminders, abandoned-checkout recovery and the daily
  # admin digest. One service rather than four because every job is idempotent —
  # each claims its rows before sending, so seeing the same due row ninety-six
  # times a day costs nothing and sends nothing extra.
  #
  # Fifteen minutes is chosen by the tightest job: abandoned-checkout recovery
  # has to land inside the window between "they have clearly stopped" and the
  # expiry sweep releasing the stock.
  # =========================================================================
  - type: cron
    name: chakrashri-scheduled-emails
    runtime: node
    region: ohio
    plan: starter
    schedule: "*/15 * * * *"
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/send-scheduled-emails.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: CLIENT_URL
        sync: false # every link in every email is built from this
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: DIGEST_HOUR_IST
        value: "8" # before this hour yesterday's numbers are not final enough to read
      - key: LOG_LEVEL
        value: info
