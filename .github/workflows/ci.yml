# HYG-08 — CI ran a keep-alive ping and never the test suite.
#
# The suite is genuinely good (101 assertions covering the concurrency and money
# paths that matter most) and it was only ever run by hand, which means a
# regression reached production the moment someone forgot. This runs it on every
# push and pull request.
#
# It also runs the migrations against a real Postgres, because a migration that
# only ever runs against production is a migration nobody has tested. That
# catches a broken CHECK constraint or a backfill that fails on an empty table
# before it reaches Neon.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same branch — no point burning
  # minutes verifying a commit that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches Neon's major version. Testing against a different major is how
        # you find out in production that a function you relied on behaves
        # differently.
        image: postgres:16
        env:
          POSTGRES_USER: chakrashri_test
          POSTGRES_PASSWORD: chakrashri_test
          POSTGRES_DB: chakrashri_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U chakrashri_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://chakrashri_test:chakrashri_test@localhost:5432/chakrashri_test
      DB_SSL: 'false'
      JWT_SECRET: ci_only_secret_not_used_anywhere_real_0123456789
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci_dummy_secret
      RAZORPAY_WEBHOOK_SECRET: ci_dummy_webhook_secret
      CLIENT_URL: https://ci.example.test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        # `ci` not `install`: fails if package-lock.json and package.json have
        # drifted, which is exactly what you want a build to tell you.
        run: npm ci

      - name: Install Chromium for every browser-driven check
        # IMMEDIATELY AFTER THE DEPENDENCIES, AND THAT POSITION IS THE POINT.
        #
        # This used to sit two thirds of the way down, just above the browser
        # suites that needed it. That works only while every browser-driven step
        # is below it, and it has now broken twice: first when the contrast
        # suite was slotted in beside the other `npm test` members, and again
        # when the responsive audit was, landing two steps ABOVE the install and
        # failing the build with "browser not found".
        #
        # Installing here removes the ordering question entirely. Nothing after
        # this line can be too early, so no future step has to remember.
        run: npx playwright install --with-deps chromium

      - name: Build the generated artifacts the audits read
        # sitemap.xml and product/ are BOTH gitignored, because both are build
        # output. They exist on a developer's machine and in the Netlify deploy,
        # and did not exist in CI - so the SEO audit failed on a missing sitemap
        # and, more quietly, skipped 101 checks across 11 prerendered product
        # pages because the directory was not there to look at. 390 checks on a
        # laptop, 289 in CI, and nothing said so.
        #
        # Both read catalog.json, which IS committed, so neither needs a
        # database. They run here, before anything that reads them, for the same
        # reason chromium does: nothing downstream should have to remember.
        run: npm run sitemap && npm run prerender

      - name: Syntax check every file
        # Runs FIRST because it is the cheapest check and catches the class of
        # bug that is invisible in a diff: a cron expression inside a block
        # comment closing it early, a backtick inside a SQL comment ending a
        # template literal, a closing script tag truncating 140KB of inline JS.
        # All three happened during this work.
        run: npm run check:syntax

      - name: Audit dependencies
        # Advisory only for moderate and below; a high or critical advisory fails
        # the build. A transitive vulnerability in a payments backend is not
        # something to discover from a customer.
        run: npm audit --audit-level=high

      - name: Apply migrations against a real Postgres
        run: npm run migrate

      - name: Apply migrations a second time (idempotency check)
        # Every migration is written to be re-runnable, and the runner tracks
        # what it has applied. Running twice proves both — and catches the class
        # of bug where a migration succeeds once and fails on a redeploy.
        run: npm run migrate

      - name: Unit tests
        run: npm run test:unit

      - name: Coupon tests
        run: npm run test:coupons

      - name: HTTP / middleware tests
        run: npm run test:http

      - name: Security and regression tests
        run: npm run test:security

      - name: Frontend tests
        # This step was missing, and it is the one that would have caught the
        # defect that prompted this change: the vendored Chart.js no longer
        # matched the SRI hash in its own script tag, which in production means
        # the browser refuses the file and the dashboard charts silently vanish.
        #
        # `npm test` has always included test:frontend. CI does not run `npm
        # test` — it runs the suites one by one, and this one was never added.
        # So the Content-Security-Policy assertions, the SRI check, the XSS
        # escaping checks, the accessible-name checks and the capability-gating
        # checks — 51 tests over the two files that are served directly to every
        # customer and every admin — were absent from the gate while every other
        # suite was present. A list of steps that has to be kept in sync by hand
        # drifts silently; this is what that drift looked like.
        run: npm run test:frontend

      - name: Email templates and scheduled jobs
        # Added in the same commit as the suite, because [fe-44] fails the
        # build otherwise — which is the whole point of that guard.
        #
        # These templates sit on money paths and none of them fails loudly: a
        # template that throws is caught upstream and swallowed, and the first
        # sign is a customer asking why they never heard anything. This is also
        # the only check that a FAILED send releases its claim marker, which is
        # the difference between a recovery email being retried and being lost.
        # Needs nothing external: both the mail engine and the database are
        # stubbed, and no message leaves the runner.
        run: npm run test:emails

      - name: Drawer and category-ranking fuzz
        # Added in the same breath as the suite itself, because the comment
        # above is the record of what happens otherwise: a suite that exists,
        # passes locally, and is never once run by the gate.
        #
        # Needs nothing external — it lifts the real functions out of index.html
        # and runs them over ~20 generated catalogues, including category names
        # an admin could really type and a 40x12 catalogue that does not exist
        # yet. It is the only thing checking that "top 15 by most sold" is a
        # total order rather than whatever the sort happened to return.
        run: npm run test:drawer

      - name: Automatic badge maths
        # "Bestseller" is a percentile over real sales now, not a field somebody
        # typed. A percentile is exactly the kind of thing that looks right and
        # is wrong at the edges — three orders in the whole shop, or everything
        # selling identically — so it is exercised over those distributions.
        run: npm run test:badges

      - name: Sri Yantra geometry
        # The mark on the hero, the awakening screen, the checkout spinner and
        # the shop's own Sri Yantra icon are all generated from one table, so a
        # bad edit to it is wrong in four places at once. The first version of
        # this figure passed a check that asserted the same misunderstanding the
        # code had, so these measure the emitted points: which way each triangle
        # actually faces, that the ink is centred on the bindu, and that nothing
        # escapes the innermost girdle and cuts through the lotus.
        run: npm run test:yantra

      - name: Invisible characters
        # A regex backreference written as backslash-one through a non-raw
        # Python string is an OCTAL escape: it produces U+0001, not a backslash
        # and a one. That shipped in the preview server and was invisible to
        # everything - sed printed nothing, grep matched around it, the file
        # parsed, and the regex simply never matched. The symptom appeared three
        # layers away. This also covers bidi overrides, which make source read
        # differently from how it runs.
        run: npm run check:chars

      - name: CSS conflicts
        # The product card once carried three overlapping phone blocks - 560px,
        # 380px and 480px, in that order - each re-declaring its type sizes.
        # Because 480px was written last it beat both of the others, which made
        # the 380px block dead code and capped the product name at .84rem on
        # every phone. Valid CSS, passing tests, and a size nobody chose. This
        # fails on a wider max-width written after a narrower one, on overlapping
        # min/max bands, and on any rule that can never win at any width.
        run: npm run css:conflicts

      - name: Responsive audit
        # Eight routes at eight widths from 320px to 1440px, measured in a real
        # browser: nothing may scroll sideways, no control may fall below the
        # 44x44 minimum for a fingertip, no button may clip its own label, and
        # no two controls may overlap. It starts its own preview server, because
        # over file:// the catalog cannot be fetched and every grid comes back
        # empty - an audit of the product card with no cards on the page would
        # pass on a site where every one of them was broken.
        env:
          # Without this it prints SKIP and exits 0 when chromium is missing —
          # a green build that measured nothing, which is worse than a red one.
          REQUIRE_BROWSER_TESTS: 'true'
        run: npm run audit:responsive

      - name: SEO audit
        # Titles, canonicals and JSON-LD are written by JavaScript on every
        # navigation here, so nothing about them is visible in the source. A
        # canonical stuck on the home page tells Google every other page is a
        # duplicate of it, and that is invisible until traffic disappears.
        env:
          # It sat ABOVE the chromium install and never set this, so in CI it
          # printed SKIPPED and exited 0 — it has never actually run here. The
          # first time it did, it failed on a missing sitemap that had been
          # missing all along.
          REQUIRE_BROWSER_TESTS: 'true'
        run: npm run seo:audit

      - name: Rendered contrast (WCAG AA)
        # Placed AFTER the chromium install, which is the whole reason this
        # step exists in this position rather than up with the offline suites.
        # It was originally slotted in beside the other `npm test` members, four
        # steps BEFORE the browser was installed, so it ran with no chromium —
        # and because REQUIRE_BROWSER_TESTS correctly forbids skipping, it
        # failed the build. The suite behaved exactly as designed; the ordering
        # was wrong. [fe-44] now asserts this ordering so it cannot recur.
        #
        # What it measures: what a person actually sees, on every route and in
        # the admin console. Reading the CSS cannot answer it — a colour is
        # only readable relative to the surface behind it, which is why a
        # section heading sat at 1.18:1 and the automatic BESTSELLER badge at
        # 2.68:1 with every static check passing.
        env:
          REQUIRE_BROWSER_TESTS: 'true'
        run: npm run test:contrast

      - name: Browser regression tests
        # Catches the class of bug that only a real browser can see. Making the
        # product card a real <a> (for crawlability) put the wishlist and
        # add-to-cart buttons inside a link; their handlers called
        # stopPropagation(), which does NOT stop the browser following the href.
        # Clicking "add to cart" navigated to the product page instead. No diff
        # review would have caught it.
        #
        # The test skips itself on a developer machine that has not downloaded
        # the Chromium binary, so a missing optional download can never take down
        # the whole suite. That leniency is wrong HERE: the step above installs
        # the browser, so a skip in CI means the install silently failed and this
        # gate has quietly stopped testing anything. REQUIRE_BROWSER_TESTS turns
        # the skip back into a failure.
        env:
          REQUIRE_BROWSER_TESTS: 'true'
        run: npm run test:browser

      - name: Admin settings screen — browser test
        # The settings screen is built with DOM calls and its labels are
        # associated at runtime, so only a browser can confirm an admin sees
        # labelled controls holding the right values. It already earned its
        # place: it caught a setting with no SETTING_META entry rendering as a
        # number input, which discarded its string value and would have
        # overwritten it with '' on the next save.
        env:
          REQUIRE_BROWSER_TESTS: 'true'
        run: npm run test:browser-settings

      - name: Admin inbox browser test
        # Archiving, filtering and replying are all about what the rendered
        # table CONTAINS and what the server RECEIVES. Static checks read the
        # intent; only a browser shows that archive actually removes a row.
        # A skip here would mean the chromium install above silently failed,
        # and this suite would report success having rendered nothing at all.
        env:
          REQUIRE_BROWSER_TESTS: 'true'
        run: npm run test:browser-inbox

      - name: Admin order drawer and low-stock browser test
        # Whether a low VARIANT appears at all is a property of the rendered
        # table, not of the source: the product-level figure that hid it is a
        # DB-derived sum, so only running it shows the row.
        # A skip here would mean the chromium install above silently failed,
        # and this suite would report success having rendered nothing at all.
        env:
          REQUIRE_BROWSER_TESTS: 'true'
        run: npm run test:browser-orders

      - name: Database integration tests
        # These run against the live Postgres service above and cover the things
        # a mocked database cannot prove: concurrent checkout of the last unit,
        # the variant stock trigger, refund-ledger arithmetic and slot capacity.
        #
        # The suite skips itself when no disposable database is configured, which
        # is right on a laptop and wrong here: in CI a skip means the service
        # container never came up, and this gate has quietly stopped testing
        # anything. REQUIRE_DB_TESTS makes that a failure instead of a notice.
        env:
          REQUIRE_DB_TESTS: 'true'
        run: npm run test:db-integration

  lint-sql:
    name: Migration hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No edits to already-applied migrations
        # Migrations are tracked by filename, so editing one that has already run
        # in production means the change reaches a fresh database and never the
        # live one — a silent, and very confusing, divergence. New work always
        # goes in a new numbered file.
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request — skipping."
            exit 0
          fi
          git fetch --no-tags --depth=50 origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only --diff-filter=M "origin/${{ github.base_ref }}"...HEAD -- migrations/ || true)
          if [ -n "$CHANGED" ]; then
            echo "::error::These already-committed migrations were modified:"
            echo "$CHANGED"
            echo "Add a new numbered migration instead — the runner tracks applied files by name and will never re-run an edited one."
            exit 1
          fi
          echo "No existing migrations were modified."
